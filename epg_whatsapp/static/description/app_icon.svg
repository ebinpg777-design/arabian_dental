<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>EPG WhatsApp</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EDC74"/>
      <stop offset="0.55" stop-color="#17A565"/>
      <stop offset="1" stop-color="#0A6A5C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F6EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#053B33" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile, lit from the top -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- back bubble: the customer typing -->
  <path d="M220 72h176a50 50 0 0 1 50 50v74a50 50 0 0 1-50 50h-2l10 52-58-52H220a50 50 0 0 1-50-50v-74a50 50 0 0 1 50-50z"
        fill="#FFFFFF" fill-opacity="0.30"/>
  <circle cx="262" cy="159" r="16" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="308" cy="159" r="16" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="354" cy="159" r="16" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- front bubble: our message, read -->
  <g filter="url(#shadow)">
    <path d="M124 214h214a58 58 0 0 1 58 58v90a58 58 0 0 1-58 58H178l-72 50 12-56a58 58 0 0 1-52-52v-90a58 58 0 0 1 58-58z"
          fill="url(#paper)"/>
  </g>
  <g fill="none" stroke="#1FA2E8" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 320l42 42 78-86"/>
    <path d="M228 350l12 12 78-86"/>
  </g>
</svg>
